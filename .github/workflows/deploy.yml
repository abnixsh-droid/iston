  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Install dependencies
    run: npm ci

  - name: Build website
    run: npm run build

  - name: Verify build output
    run: |
      ls -la dist
      test -f dist/index.html

  - name: Deploy to Hostinger via FTP
    uses: SamKirkland/FTP-Deploy-Action@v4.3.5
    with:
      server: ${{ secrets.FTP_SERVER }}
      username: ${{ secrets.FTP_USERNAME }}
      password: ${{ secrets.FTP_PASSWORD }}
      protocol: ftp
      port: 21
      local-dir: dist/
      server-dir: ./   # use "./" if you created a site-scoped FTP user whose home is your domain's public_html
      # If you are using the main FTP user instead, use the exact domain path:
      # server-dir: domains/istongroupbuilder.in/public_html/
      dangerous-clean-slate: true
